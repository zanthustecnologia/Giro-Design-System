name: "🐛 Bug Report"
description: Reporte um comportamento inesperado ou erro
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Antes de começar...**

        Obrigado por dedicar seu tempo para reportar um bug!
        Preencha o máximo de detalhes possível para nos ajudar a entender e reproduzir o problema.
        Se você tem uma dúvida, sugestão ou pedido de nova funcionalidade, utilize as [Discussões do GitHub](https://github.com/zanthustecnologia/design-system-monorepo/discussions).
        Obrigado!

  - type: input
    id: version
    attributes:
      label: Versão do pacote Giro DS
      placeholder: ex: 3.2.0
    validations:
      required: true

  - type: input
    id: componente
    attributes:
      label: Componente
      description: Qual componente está com problema?
      placeholder: ex: Avatar, Button, Switch...
    validations:
      required: true

  - type: dropdown
    id: plataforma
    attributes:
      label: Plataforma
      options:
        - React
        - Flutter
        - Compose
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Descrição do bug
      description: Uma descrição clara e objetiva do que está acontecendo.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Comportamento esperado
      description: Uma descrição clara do que você esperava que acontecesse.
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Passos para reproduzir
      placeholder: |
        ex:
        1. Ir para '...'
        2. Clicar em '...'
        3. Observar que '...'
    validations:
      required: true

  - type: input
    id: reproduction-link
    attributes:
      label: Link de reprodução
      description: |
        Se possível, forneça um exemplo mínimo que reproduza o bug (StackBlitz, CodeSandbox, repositório, etc).

  - type: textarea
    id: system-info
    attributes:
      label: Informações do ambiente
      description: Execute e cole o resultado de `npx envinfo --system --npmPackages @giro-ds/react,react --binaries --browsers`
      render: shell
      placeholder: Sistema Operacional, Navegador, versão do React...

  - type: textarea
    id: additional-context
    attributes:
      label: Contexto adicional e prints
      description: Adicione qualquer outro contexto relevante. Se aplicável, inclua prints ou vídeos para ilustrar o problema.
