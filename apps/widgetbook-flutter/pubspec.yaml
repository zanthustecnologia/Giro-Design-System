name: widgetbook_flutter
description: Widgetbook showcase for Giro Design System Flutter components
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  fluentui_system_icons: ^1.1.273
  flutter:
    sdk: flutter
  flutter_giro:
    path: ../../packages/flutter
  google_fonts: ^6.3.3
  widgetbook: ^3.8.0
  widgetbook_annotation: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  widgetbook_generator: ^3.8.0

flutter:
  uses-material-design: true
