<script>
  // Pre-popula o localStorage com o código de boas-vindas do Playground se for a primeira
  // visita. O storybook-addon-playground usa useParameter (assíncrono) para ler o introCode,
  // mas esse hook retorna null antes dos parâmetros da story chegarem ao manager, deixando
  // o editor em branco. Pré-popular via localStorage (síncrono) resolve a corrida.
  (function () {
    var STORAGE_KEY = 'storybook-playground-v1';
    try {
      if (!localStorage.getItem(STORAGE_KEY)) {
        var jsx = `() => {
  const [timesClicked, setTimesClicked] = React.useState(0);

  return (
    <div style={{
      width: '100%',
      height: '100%',
      display: 'flex',
      flexDirection: 'column',
      alignItems: 'center',
      justifyContent: 'center',
      gap: '8px',
      fontFamily: 'var(--font-family-primary, Figtree, sans-serif)',
    }}>
      <img
        src="/images/giro-logo.svg"
        alt="Giro DS"
        style={{ width: '300px', height: 'auto', display: 'block', marginTop: '54px', marginBottom: '16px' }}
      />
      <div style={{ marginBottom: '18px', fontSize: '32px', fontWeight: 700, color: 'var(--color-neutral-low-default, #111119)' }}>
        Playground
      </div>
      <div style={{ marginBottom: '16px', fontSize: '16px', color: 'var(--color-neutral-low-medium, #3f3f3f)', textAlign: 'center' }}>
        Experimente, construa e explore os componentes do Giro DS.
      </div>
      <Button variant="outlined" size="sm" onClick={() => setTimesClicked(p => p + 1)} style={{ marginTop: '8px' }}>
        Clicado {timesClicked} {timesClicked === 1 ? 'vez' : 'vezes'}
      </Button>
      <div style={{ marginTop: '14px', fontSize: '14px', color: 'var(--color-neutral-low-medium, #3f3f3f)' }}>
        Não está vendo o editor? Pressione 'Alt + D' no teclado.
      </div>
    </div>
  );
}`;
        var css = `html, body, #storybook-root, #storybook-root > *, #storybook-root > * > * {
  height: 100%;
  margin: 0;
}`;
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ jsx: jsx, css: css }));
      }
    } catch (e) { /* localStorage indisponível */ }
  })();
</script>

<script>
  function updateTitle() {
    const isHome = location.search.toLowerCase().includes('boas-vindas');
    const desired = isHome
      ? 'Giro Design System'
      : document.title.replace(/·?\s*Storybook/g, '- Giro Design System').trim();

    if (document.title !== desired) {
      observer.disconnect();
      document.title = desired;
      observer.observe(document.querySelector('title') || document.head, { subtree: true, characterData: true, childList: true });
    }
  }

  const observer = new MutationObserver(updateTitle);
  observer.observe(document.querySelector('title') || document.head, { subtree: true, characterData: true, childList: true });
</script>
