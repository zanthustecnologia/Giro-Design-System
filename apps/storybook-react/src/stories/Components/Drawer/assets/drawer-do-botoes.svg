<svg width="280" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Frame -->
  <rect width="280" height="200" fill="#F4F4F7" rx="10"/>
  <!-- Top bar -->
  <rect width="280" height="32" fill="#FFFFFF" rx="10 10 0 0"/>
  <line x1="0" y1="32" x2="280" y2="32" stroke="#E8E8EC" stroke-width="1"/>
  <circle cx="16" cy="16" r="4" fill="#CFD0DA"/>
  <circle cx="30" cy="16" r="4" fill="#CFD0DA"/>
  <circle cx="44" cy="16" r="4" fill="#CFD0DA"/>
  <!-- Overlay -->
  <rect x="0" y="32" width="88" height="168" fill="#111119" opacity="0.22"/>
  <!-- Drawer panel -->
  <rect x="88" y="32" width="192" height="168" fill="#FFFFFF"/>
  <!-- Header -->
  <line x1="88" y1="60" x2="280" y2="60" stroke="#E8E8EC" stroke-width="1"/>
  <rect x="102" y="42" width="80" height="8" fill="#111119" rx="4"/>
  <!-- X button -->
  <line x1="256" y1="40" x2="266" y2="50" stroke="#505255" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="266" y1="40" x2="256" y2="50" stroke="#505255" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Form fields -->
  <rect x="102" y="70" width="50" height="6" fill="#CFD0DA" rx="3"/>
  <rect x="102" y="82" width="162" height="22" rx="4" fill="none" stroke="#E8E8EC" stroke-width="1.5"/>
  <rect x="102" y="112" width="60" height="6" fill="#CFD0DA" rx="3"/>
  <rect x="102" y="124" width="162" height="22" rx="4" fill="none" stroke="#E8E8EC" stroke-width="1.5"/>
  <!-- Footer divider -->
  <line x1="88" y1="158" x2="280" y2="158" stroke="#E8E8EC" stroke-width="1"/>
  <!-- Cancel button (outlined) -->
  <rect x="102" y="167" width="66" height="24" rx="5" fill="none" stroke="#CFD0DA" stroke-width="1.5"/>
  <rect x="116" y="177" width="38" height="6" fill="#CFD0DA" rx="3"/>
  <!-- Save button (filled) -->
  <rect x="176" y="167" width="88" height="24" rx="5" fill="#4A6DFF"/>
  <rect x="192" y="177" width="56" height="6" fill="#FFFFFF" rx="3"/>
</svg>
