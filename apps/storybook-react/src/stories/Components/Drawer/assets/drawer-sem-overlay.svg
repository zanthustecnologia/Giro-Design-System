<svg width="560" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Frame -->
  <rect width="560" height="200" fill="#F4F4F7" rx="10"/>
  <!-- Top bar -->
  <rect width="560" height="32" fill="#FFFFFF" rx="10 10 0 0"/>
  <line x1="0" y1="32" x2="560" y2="32" stroke="#E8E8EC" stroke-width="1"/>
  <circle cx="16" cy="16" r="4" fill="#CFD0DA"/>
  <circle cx="30" cy="16" r="4" fill="#CFD0DA"/>
  <circle cx="44" cy="16" r="4" fill="#CFD0DA"/>
  <!-- Page content (dimmed) -->
  <rect x="16" y="44" width="90" height="8" fill="#CFD0DA" rx="4"/>
  <rect x="16" y="60" width="120" height="7" fill="#E8E8EC" rx="3"/>
  <rect x="16" y="74" width="100" height="7" fill="#E8E8EC" rx="3"/>
  <!-- Overlay with blocked cursor -->
  <rect x="0" y="32" width="300" height="168" fill="#111119" opacity="0.22"/>
  <!-- Click blocked indicator on overlay -->
  <circle cx="150" cy="116" r="20" fill="#E8392A" opacity="0.14"/>
  <circle cx="150" cy="116" r="16" fill="none" stroke="#E8392A" stroke-width="2"/>
  <line x1="139" y1="105" x2="161" y2="127" stroke="#E8392A" stroke-width="2" stroke-linecap="round"/>
  <!-- Small tooltip -->
  <rect x="80" y="140" width="140" height="20" rx="5" fill="#111119" opacity="0.75"/>
  <rect x="92" y="147" width="116" height="6" fill="#FFFFFF" rx="3"/>
  <!-- Drawer panel -->
  <rect x="300" y="32" width="260" height="168" fill="#FFFFFF"/>
  <line x1="300" y1="60" x2="560" y2="60" stroke="#E8E8EC" stroke-width="1"/>
  <rect x="316" y="42" width="80" height="8" fill="#111119" rx="4"/>
  <!-- X button -->
  <line x1="532" y1="40" x2="542" y2="50" stroke="#505255" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="542" y1="40" x2="532" y2="50" stroke="#505255" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Form content -->
  <rect x="316" y="70" width="50" height="6" fill="#CFD0DA" rx="3"/>
  <rect x="316" y="82" width="222" height="20" rx="4" fill="none" stroke="#E8E8EC" stroke-width="1.5"/>
  <rect x="316" y="110" width="60" height="6" fill="#CFD0DA" rx="3"/>
  <rect x="316" y="122" width="222" height="20" rx="4" fill="none" stroke="#E8E8EC" stroke-width="1.5"/>
  <!-- Footer with buttons -->
  <line x1="300" y1="156" x2="560" y2="156" stroke="#E8E8EC" stroke-width="1"/>
  <rect x="316" y="165" width="80" height="24" rx="5" fill="none" stroke="#CFD0DA" stroke-width="1.5"/>
  <rect x="330" y="175" width="52" height="5" fill="#CFD0DA" rx="2"/>
  <rect x="408" y="165" width="130" height="24" rx="5" fill="#4A6DFF"/>
  <rect x="430" y="175" width="86" height="5" fill="#FFFFFF" rx="2"/>
</svg>
