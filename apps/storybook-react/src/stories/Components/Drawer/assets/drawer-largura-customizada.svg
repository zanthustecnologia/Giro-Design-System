<svg width="560" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Frame -->
  <rect width="560" height="200" fill="#F4F4F7" rx="10"/>
  <!-- Top bar -->
  <rect width="560" height="32" fill="#FFFFFF" rx="10 10 0 0"/>
  <line x1="0" y1="32" x2="560" y2="32" stroke="#E8E8EC" stroke-width="1"/>
  <circle cx="16" cy="16" r="4" fill="#CFD0DA"/>
  <circle cx="30" cy="16" r="4" fill="#CFD0DA"/>
  <circle cx="44" cy="16" r="4" fill="#CFD0DA"/>
  <!-- Page content -->
  <rect x="16" y="44" width="90" height="8" fill="#CFD0DA" rx="4"/>
  <rect x="16" y="60" width="120" height="7" fill="#E8E8EC" rx="3"/>
  <rect x="16" y="74" width="100" height="7" fill="#E8E8EC" rx="3"/>
  <rect x="16" y="88" width="80" height="7" fill="#E8E8EC" rx="3"/>
  <!-- Overlay -->
  <rect x="0" y="32" width="220" height="168" fill="#111119" opacity="0.22"/>
  <!-- Wide Drawer panel (600px equivalent) -->
  <rect x="220" y="32" width="340" height="168" fill="#FFFFFF"/>
  <line x1="220" y1="60" x2="560" y2="60" stroke="#E8E8EC" stroke-width="1"/>
  <rect x="236" y="42" width="70" height="8" fill="#111119" rx="4"/>
  <!-- X button -->
  <line x1="532" y1="40" x2="542" y2="50" stroke="#505255" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="542" y1="40" x2="532" y2="50" stroke="#505255" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Content inside wide drawer -->
  <rect x="236" y="70" width="50" height="6" fill="#CFD0DA" rx="3"/>
  <rect x="236" y="82" width="292" height="22" rx="4" fill="none" stroke="#E8E8EC" stroke-width="1.5"/>
  <rect x="236" y="112" width="70" height="6" fill="#CFD0DA" rx="3"/>
  <rect x="236" y="124" width="292" height="22" rx="4" fill="none" stroke="#E8E8EC" stroke-width="1.5"/>
  <!-- Width indicator arrow -->
  <line x1="220" y1="188" x2="560" y2="188" stroke="#4A6DFF" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="220" y1="183" x2="220" y2="193" stroke="#4A6DFF" stroke-width="1.5"/>
  <line x1="560" y1="183" x2="560" y2="193" stroke="#4A6DFF" stroke-width="1.5"/>
  <!-- Width label -->
  <rect x="360" y="180" width="60" height="16" fill="#4A6DFF" rx="4"/>
  <rect x="368" y="186" width="44" height="5" fill="#FFFFFF" rx="2"/>
</svg>
