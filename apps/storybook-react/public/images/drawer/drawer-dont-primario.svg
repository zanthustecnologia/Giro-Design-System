<svg width="280" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Frame -->
  <rect width="280" height="200" fill="#F4F4F7" rx="10"/>
  <!-- Top bar -->
  <rect width="280" height="32" fill="#FFFFFF" rx="10 10 0 0"/>
  <line x1="0" y1="32" x2="280" y2="32" stroke="#E8E8EC" stroke-width="1"/>
  <circle cx="16" cy="16" r="4" fill="#CFD0DA"/>
  <circle cx="30" cy="16" r="4" fill="#CFD0DA"/>
  <circle cx="44" cy="16" r="4" fill="#CFD0DA"/>
  <!-- Tiny sliver of overlay - page almost invisible -->
  <rect x="0" y="32" width="22" height="168" fill="#111119" opacity="0.28" rx="0 0 0 10"/>
  <!-- Drawer taking most of screen -->
  <rect x="22" y="32" width="258" height="168" fill="#FFFFFF"/>
  <!-- Drawer header -->
  <line x1="22" y1="60" x2="280" y2="60" stroke="#E8E8EC" stroke-width="1"/>
  <rect x="38" y="42" width="80" height="8" fill="#111119" rx="4"/>
  <!-- X button -->
  <line x1="254" y1="40" x2="264" y2="50" stroke="#505255" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="264" y1="40" x2="254" y2="50" stroke="#505255" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Full form inside drawer (primary content) -->
  <rect x="38" y="70" width="50" height="6" fill="#CFD0DA" rx="3"/>
  <rect x="38" y="82" width="212" height="22" rx="4" fill="none" stroke="#E8E8EC" stroke-width="1.5"/>
  <rect x="38" y="112" width="60" height="6" fill="#CFD0DA" rx="3"/>
  <rect x="38" y="124" width="212" height="22" rx="4" fill="none" stroke="#E8E8EC" stroke-width="1.5"/>
  <rect x="38" y="158" width="90" height="26" rx="5" fill="#4A6DFF"/>
  <rect x="54" y="168" width="58" height="6" fill="#FFFFFF" rx="3"/>
  <!-- Alert indicator on the thin sliver: almost no page visible -->
  <rect x="0" y="88" width="22" height="48" fill="#E8392A" opacity="0.2"/>
  <line x1="11" y1="100" x2="11" y2="124" stroke="#E8392A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="6" y1="106" x2="11" y2="100" stroke="#E8392A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="106" x2="11" y2="100" stroke="#E8392A" stroke-width="1.5" stroke-linecap="round"/>
</svg>
