name: storybook_flutter
description: Widgetbook showcase for Zanthus Flutter components
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  zanthus_flutter:
    path: ../../packages/components-flutter
  widgetbook: ^3.8.0
  widgetbook_annotation: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  widgetbook_generator: ^3.8.0

flutter:
  uses-material-design: true
